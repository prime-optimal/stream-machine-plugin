[tools]
fnox = "1.36.0"
age = "1.3.2"
op = "2.34.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
bun = "1.4.4"
hk = "2.0.1"
pkl = "0.32.1"
"github:jeduden/mdsmith" = "0.55.0"
uv = "0.13.6"

[tasks."secrets:check"]
description = "Scan complete staged blobs without changing the index"
run = "bun scripts/check-staged-secrets.ts"

[tasks.install]
description = "Install locked development dependencies"
run = "bun install --frozen-lockfile"

[tasks.build]
description = "Bundle MCP server and native UI"
run = "bun run build"

[tasks.check]
description = "Check TypeScript contracts"
run = "bun run check"

[tasks.test]
description = "Verify recipe and connection boundaries"
run = "bun test ./tests"

[tasks.smoke]
description = "Exercise bundled server over real stdio MCP"
depends = ["build"]
run = "bun run smoke"

[tasks."ui:audit"]
description = "Report OpenAI MCP extension UI feature usage over real stdio MCP"
depends = ["build"]
run = "bun run ui:audit"

[tasks.preview]
description = "Open loopback demo UI against the real MCP server"
depends = ["build"]
run = "fnox --if-missing ignore exec -- bun run preview"

[tasks."worker:start"]
description = "Start the independent Twitch-to-OBS worker, paused"
depends = ["build"]
run = "fnox exec -- bun dist/worker.js start --adapter {{config_root}}/dist/demo-worker.js"

[tasks."worker:status"]
description = "Read independent worker status"
run = "bun dist/worker.js status"

[tasks."worker:arm"]
description = "Arm the configured Twitch-to-OBS alert rule"
run = "bun dist/worker.js arm"

[tasks."worker:pause"]
description = "Pause new worker actions"
run = "bun dist/worker.js pause"

[tasks."worker:stop"]
description = "Stop the independent local worker"
run = "bun dist/worker.js stop"

[tasks.package]
description = "Build private desktop plugin archive"
depends = ["build"]
run = "bun run package"

[tasks."hooks:install"]
description = "Install repository hk hooks through mise"
run = "hk install --mise"

[tasks."hooks:check"]
description = "Check eligible files without fixing or staging"
run = "hk check --all"

[tasks."git:handoff"]
description = "Check clean worktree and matching upstream without changing Git state"
run = "bash scripts/check-handoff.sh"

[tasks.changelog]
description = "Generate unreleased changelog from conventional commits"
run = "uv run --no-project --with commitizen==4.19.3 cz changelog"

[tasks."changelog:preview"]
description = "Preview changelog without writing files"
run = "uv run --no-project --with commitizen==4.19.3 cz changelog --dry-run"

[tasks."release:preview"]
description = "Preview next release with Commitizen without writing files"
run = "uv run scripts/release-plan.py preview"

[tasks."release:prepare"]
description = "Prepare synchronized release files without commits or tags"
run = "uv run scripts/release-plan.py prepare"

[tasks."release:publish"]
description = "Publish the current version as a GitHub Release with its packages; pass --dry-run to only report"
run = "bun scripts/release-publish.ts"

[tasks.codex-sessions]
description = "List this project's Codex sessions from the local Codex database in docs/submission/codex-sessions.html"
run = "bun scripts/codex-sessions.ts"

[env]
HK_MISE = "1"
