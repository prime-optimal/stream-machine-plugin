version: 1
exclude:
  - docs/CHANGELOG.md
  - docs/archive/**
nouns:
  plugin:
    - canonical: demo
      deprecated: [simulated, demonstration]
    - canonical: prototype
      deprecated: [scaffold]
    - canonical: channel updates
      deprecated: [channel changes]
    - canonical: channel update
      deprecated: [channel change]
    - canonical: demos
      deprecated: [demonstrations]
    - canonical: OpenDesign service
      deprecated: [OpenDesign Cloud]
    - canonical: read-back
      deprecated: [readback]
    - canonical: running processes
      deprecated: [running dependencies]
    - canonical: running process
      deprecated: [running dependency]
    - canonical: mock demo
      deprecated: [mock sample]
    - canonical: fictional demo
      deprecated: [fictional sample]
    - canonical: fictional demo's
      deprecated: [fictional sample's]
    - canonical: that demo account
      deprecated: [that sample account]
    - canonical: demo data
      deprecated: [sample data]
rejected:
  - term: mock
    reason: Names the mock data layer and status value (status "mock" in catalog.ts); demo names the user-facing account.
  - term: fictional
    reason: Skills tell the agent to describe demo data as fictional to the user.
  - term: server
    reason: Also names third-party stdio MCP servers and the loopback preview server.
  - term: workflow
    reason: Umbrella and Elgato-app sense, not a recipe.
  - term: integration
    reason: Integration inventory and risk, distinct from a provider.
  - term: apply
    reason: Names the absent apply tool.
  - term: hardware
    reason: Hardware also means physical-test category; not interchangeable with device.
  - term: task
    reason: Task also names mise tasks and generic work; not a synonym for issue.
  - term: invited streamer
    reason: Streamer is the role in milestone and issue titles; user is the account concept.
  - term: title update
    reason: Title update is one specific channel update; channel updates also cover other fields.
  - term: journal
    reason: Creative SQLite journal and worker ledger are separate stores in different components.
  - term: confirm
    reason: Ordinary verb; confirm checks external state, verify checks own results. Too broad to map.
  - term: working tree
    reason: 'Git terms differ: working tree is files in a checkout; worktree is a linked checkout.'
  - term: credential
    reason: Credential covers tokens, files, bearer auth; secret names scanner and fnox values.
  - term: child
    reason: Child is RepoPrompt run terminology and also means child issues; not a synonym.
  - term: checkout
    reason: Checkout means a clone or primary directory; worktree is a linked checkout.
  - term: session
    reason: Session is an agent session; writer is the actor editing files. Different meanings.
