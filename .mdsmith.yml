# Generated by mise run repo-init. Obsidian-style repository Markdown gate.
convention: obsidian

rules:
  table-format: false
  line-length: false
  max-file-length: false
  paragraph-readability: false
  token-budget: false
  table-readability: false
  no-emphasis-as-heading: false
  empty-section-body: false
  blockquote-whitespace: false
  emphasis-style:
    bold: asterisk
    italic: underscore
  no-undefined-reference-labels:
    shortcut: collapsed-only
  cross-file-reference-integrity:
    placeholders: [var-token]
    wikilinks: true

ignore:
  - CHANGELOG.md
  - LICENSE.md
  - .agents/**
  - .omp/**
  - .claude/**
  - .codex/**
  - .cursor/**
  - .opencode/**
  - CLAUDE.md
  - AGENTS.md
  - GEMINI.md
  - COPILOT_INSTRUCTIONS.md

overrides:
  - glob: ["skills/**/SKILL.md"]
    rules:
      first-line-heading: false
  - glob: ["docs/verification.md"]
    rules:
      no-bare-urls: false
  - glob: ["plans/**"]
    rules:
      no-duplicate-headings: false
