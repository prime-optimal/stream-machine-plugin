name: Publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-publish
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      published: ${{ steps.plan.outputs.published }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Find release commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mise run release:publish --dry-run | tee "$RUNNER_TEMP/release.json"
          jq -r '"commit=\(.commit)", "published=\(.published)", "tag=\(.tag)"' "$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"
  publish:
    needs: plan
    if: needs.plan.outputs.published == 'false'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run install
      - run: mise run check
      - run: mise run test
      - run: mise run smoke
      - run: mise run package
      - name: Publish ${{ needs.plan.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/release-publish.ts" > "$RUNNER_TEMP/release-publish.ts"
          bun "$RUNNER_TEMP/release-publish.ts"
