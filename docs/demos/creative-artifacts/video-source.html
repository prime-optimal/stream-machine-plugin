<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b0f;
        font-family: Arial, system-ui, sans-serif;
        color: #ffb76b;
      }
      #root { width: 1920px; height: 1080px; }
      .title-card { width: 100%; height: 100%; padding: 120px; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 112px; line-height: 1.1; font-weight: 700; letter-spacing: 0.06em; text-align: center; max-width: 1680px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
      data-od-id="title-composition"
    ><div id="title-card" class="clip title-card" data-start="0" data-duration="3" data-track-index="0" data-od-id="title-card"><h1 id="stream-title" data-od-id="stream-title">STREAM MACHINE</h1></div></div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#stream-title", { opacity: 0, y: 32, duration: 0.55, ease: "power3.out" }, 0.1);
      tl.to("#stream-title", { opacity: 0, y: -16, duration: 0.45, ease: "power2.in" }, 2.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
